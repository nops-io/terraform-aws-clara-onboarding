              - 'lightsail:GetKeyPair'
              - 'lightsail:GetRelationalDatabaseLogStreams'
              - 'logs:GetLogEvents'
              - 'logs:StartQuery'
              - 'machinelearning:GetMLModel'
              - 'macie2:GetAdministratorAccount'
