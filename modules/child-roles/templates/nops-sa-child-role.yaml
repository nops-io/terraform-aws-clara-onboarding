AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Vendored from Clara's CloudFormation templates — do not edit.
  nOps Savings Analysis — Child Account Role. Creates nops-sa-child-role with the same
  effective permissions as the payer role's Full Platform policy (AWS-managed
  ReadOnlyAccess + nOpsSAChildDenyList1/2 + nOpsSAChildS3DataDeny + platform extras),
  so nOps can read resource inventory, tagging, and compute optimization data from
  organization member accounts.
  Deploy via StackSets from the payer / management account (or delegated admin), or
  individually per child account.

Parameters:
  PayerRoleArn:
    Type: String
    Description: >
      ARN of the nOps integration role in your payer (management) account
      (e.g. arn:aws:iam::123456789012:role/nops-integration-role-42).
      This role is the only principal allowed to assume the child role.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
    ConstraintDescription: Must be a valid IAM role ARN.

Resources:
  NopsSAChildExtrasPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: nOpsSAChildPermissions
      # Description is immutable; do not edit once shipped (Named IAM replacement cannot reuse ManagedPolicyName).
      # Keep single-line: YAML > folding appends a trailing newline that IAM rejects on create.
      Description: nOps Savings Analysis child role - platform extras on top of ReadOnlyAccess
      PolicyDocument:
        'Version': '2012-10-17'
        'Statement':
          - 'Effect': 'Allow'
            'Action':
              - 'apigateway:GET'
              - 'bcm-data-exports:CreateExport'
              - 'bcm-data-exports:GetExecution'
              - 'bcm-data-exports:GetExport'
              - 'bcm-data-exports:ListExecutions'
              - 'bcm-data-exports:ListExports'
              - 'bcm-data-exports:ListTables'
              - 'bcm-data-exports:UpdateExport'
              - 'bedrock-agentcore:List*'
              - 'bedrock-agentcore:Get*'
              - 'ce:CreateAnomalyMonitor'
              - 'ce:Describe*'
              - 'ce:Get*'
              - 'ce:List*'
              - 'ce:StartSavingsPlansPurchaseRecommendationGeneration'
              - 'ce:UpdateCostAllocationTagsStatus'
              - 'cloudwatch:GetMetricData'
              - 'cost-optimization-hub:*'
              - 'cur:DeleteReportDefinition'
              - 'cur:DescribeReportDefinitions'
              - 'cur:PutReportDefinition'
              - 'ec2:CreateSnapshot'
              - 'ec2:CreateTags'
              - 'ec2:DeleteVolume'
              - 'events:CreateEventBus'
              - 'lambda:GetFunctionConfiguration'
              - 'organizations:InviteAccountToOrganization'
              - 'pricing:*'
              - 'rds:AddTagsToResource'
              - 'savingsplans:List*'
              - 'servicequotas:Get*'
              - 'servicequotas:List*'
              - 'servicequotas:RequestServiceQuotaIncrease'
              - 'support:AddCommunicationToCase'
              - 'support:CreateCase'
              - 'support:Describe*'
              - 'support:ResolveCase'
              - 'wellarchitected:*'
            'Resource': '*'

  NopsSAChildDenyPolicy1:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: nOpsSAChildDenyList1
      # Description is immutable; do not edit once shipped (Named IAM replacement cannot reuse ManagedPolicyName).
      Description: nOps Savings Analysis child role - Deny list part 1 of 2
      PolicyDocument:
        'Version': '2012-10-17'
        'Statement':
          - 'Effect': 'Deny'
            'Action':
              - 'acm-pca:Describe*'
              - 'acm-pca:Get*'
              - 'acm-pca:List*'
              - 'acm:Describe*'
              - 'acm:Get*'
              - 'acm:List*'
              - 'appconfig:GetConfiguration*'
              - 'appflow:DescribeConnector*'
              - 'appflow:ListConnector*'
              - 'appstream:DescribeDirectoryConfigs'
              - 'appstream:DescribeUsers'
              - 'appstream:DescribeSessions'
              - 'appsync:Get*'
              - 'appsync:List*'
              - 'athena:Get*'
              - 'athena:List*'
              - 'backup:GetBackupVaultAccessPolicy'
              - 'cassandra:Select'
              - 'chime:Describe*'
              - 'chime:Get*'
              - 'chime:List*'
              - 'cloud9:Describe*'
              - 'cloud9:Get*'
              - 'cloud9:List*'
              - 'clouddirectory:Get*'
              - 'clouddirectory:List*'
              - 'cloudfront:GetCloudFrontOriginAccessIdentity'
              - 'cloudfront:GetFieldLevelEncryption*'
              - 'cloudfront:GetKeyGroupConfig'
              - 'cloudwatch:GetMetricStream'
              - 'cloudwatch:ListMetricStreams'
              - 'codeartifact:GetAuthorizationToken'
              - 'codeartifact:ReadFromRepository'
              - 'codebuild:BatchGet*'
              - 'codebuild:ListSourceCredentials'
              - 'codecommit:BatchGet*'
              - 'codecommit:Get*'
              - 'codecommit:GitPull'
              - 'codedeploy:BatchGet*'
              - 'codedeploy:Get*'
              - 'codestar:DescribeUserProfile'
              - 'codestar:ListUserProfiles'
              - 'cognito-identity:*'
              - 'cognito-idp:*'
              - 'cognito-sync:*'
              - 'comprehend:Describe*'
              - 'comprehend:List*'
              - 'config:BatchGetAggregateResourceConfig'
              - 'config:BatchGetResourceConfig'
              - 'config:SelectAggregateResourceConfig'
              - 'config:SelectResourceConfig'
              - 'connect:Describe*'
              - 'connect:Get*'
              - 'connect:List*'
              - 'datapipeline:DescribeObjects'
              - 'datapipeline:EvaluateExpression'
              - 'datapipeline:QueryObjects'
              - 'dax:BatchGetItem'
              - 'dax:GetItem'
              - 'dax:Query'
              - 'deepcomposer:Get*'
              - 'deepcomposer:List*'
              - 'devicefarm:GetRemoteAccessSession'
              - 'devicefarm:ListRemoteAccessSessions'
              - 'directconnect:Describe*'
              - 'directconnect:List*'
              - 'discovery:Describe*'
              - 'discovery:Get*'
              - 'discovery:List*'
              - 'dms:Describe*'
              - 'dms:List*'
              - 'ds:Get*'
              - 'dynamodb:GetItem'
              - 'dynamodb:BatchGetItem'
              - 'dynamodb:Query'
              - 'dynamodb:Scan'
              - 'ec2:GetConsoleScreenshot'
              - 'ecr:BatchGetImage'
              - 'ecr:GetAuthorizationToken'
              - 'ecr:GetDownloadUrlForLayer'
              - 'ecr-public:GetAuthorizationToken'
              - 'eks:DescribeIdentityProviderConfig'
              - 'elasticbeanstalk:DescribeConfigurationOptions'
              - 'elasticbeanstalk:DescribeConfigurationSettings'
              - 'es:ESHttpGet*'
              - 'fis:GetExperimentTemplate'
              - 'fms:GetAdminAccount'
              - 'frauddetector:BatchGetVariable'
              - 'frauddetector:Get*'
              - 'gamelift:GetGameSessionLogUrl'
              - 'gamelift:GetInstanceAccess'
              - 'geo:ListDevicePositions'
              - 'glue:GetSecurityConfiguration*'
            'Resource': '*'

  NopsSAChildDenyPolicy2:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: nOpsSAChildDenyList2
      # Description is immutable; do not edit once shipped (Named IAM replacement cannot reuse ManagedPolicyName).
      Description: nOps Savings Analysis child role - Deny list part 2 of 2
      PolicyDocument:
        'Version': '2012-10-17'
        'Statement':
          - 'Effect': 'Deny'
            'Action':
              - 'glue:SearchTables'
              - 'glue:GetTable*'
              - 'guardduty:GetIPSet'
              - 'guardduty:GetMasterAccount'
              - 'guardduty:GetMembers'
              - 'guardduty:ListMembers'
              - 'guardduty:ListOrganizationAdminAccounts'
              - 'inspector2:GetConfiguration'
