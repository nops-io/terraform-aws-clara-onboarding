              - 'waf-regional:GetChangeToken'
              - 'workmail:DescribeUser'
              - 'workmail:GetMailUserDetails'
              - 'workmail:ListUsers'
            'Resource': '*'

  NopsSAChildS3DataDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: nOpsSAChildS3DataDeny
      # Description is immutable; do not edit once shipped (Named IAM replacement cannot reuse ManagedPolicyName).
      Description: nOps Savings Analysis child role - Deny S3 object data reads
      PolicyDocument:
        'Version': '2012-10-17'
        'Statement':
          - 'Sid': 'DenyObjectData'
            'Effect': 'Deny'
            'Action':
              - 's3:GetObject*'
              - 's3-object-lambda:GetObject*'
              - 's3-outposts:GetObject*'
              - 's3express:CreateSession'
              - 's3tables:GetTableData'
              - 'glacier:GetJobOutput'
            'Resource': '*'

  NopsSAChildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nops-sa-child-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref PayerRoleArn
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/ReadOnlyAccess'
        - !Ref NopsSAChildExtrasPolicy
        - !Ref NopsSAChildDenyPolicy1
        - !Ref NopsSAChildDenyPolicy2
        - !Ref NopsSAChildS3DataDenyPolicy

Outputs:
  RoleArn:
    Description: ARN of the nops-sa-child-role created in this account.
    Value: !GetAtt NopsSAChildRole.Arn
