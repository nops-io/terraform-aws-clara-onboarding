AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AUTO-GENERATED by scripts/generate-aws-sa-minimum-child-role-template.mjs — do not edit.
  nOps Savings Analysis — Minimal Child Account Role. Creates nops-sa-child-role-minimal
  with a curated read-only allow-list for resource inventory, tagging, and compute
  optimization data in organization member accounts. No ReadOnlyAccess or Deny list —
  minimal blast radius for sensitive child accounts.
  Deploy via StackSets from the payer / management account (or delegated admin), or
  individually per child account.

Parameters:
  PayerRoleArn:
    Type: String
    Description: >
      ARN of the nOps integration role in your payer (management) account
      (e.g. arn:aws:iam::123456789012:role/nops-integration-role-42).
      This role is the only principal allowed to assume the child role.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
    ConstraintDescription: Must be a valid IAM role ARN.

Resources:
  NopsSAMinimalChildPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: nOpsSAMinimalChildPermissions
      # Description is immutable; do not edit once shipped (Named IAM replacement cannot reuse ManagedPolicyName).
      # Keep single-line: YAML > folding appends a trailing newline that IAM rejects on create.
      Description: nOps Savings Analysis minimal child role - curated read-only inventory access
      PolicyDocument:
        'Version': '2012-10-17'
        'Statement':
          - 'Effect': 'Allow'
            'Action':
              - 'autoscaling:DescribeAutoScalingGroups'
              - 'autoscaling:DescribeAutoScalingInstances'
              - 'cloudwatch:GetMetricStatistics'
              - 'cloudwatch:ListMetrics'
              - 'compute-optimizer:GetAutoScalingGroupRecommendations'
              - 'compute-optimizer:GetEBSVolumeRecommendations'
              - 'compute-optimizer:GetEC2InstanceRecommendations'
              - 'compute-optimizer:GetEnrollmentStatus'
              - 'compute-optimizer:GetLambdaFunctionRecommendations'
              - 'ec2:DescribeImages'
              - 'ec2:DescribeInstances'
              - 'ec2:DescribeReservedInstances'
              - 'ec2:DescribeSnapshots'
              - 'ec2:DescribeVolumes'
              - 'ec2:DescribeVolumeStatus'
              - 'ecs:DescribeClusters'
              - 'ecs:DescribeServices'
              - 'ecs:ListClusters'
              - 'ecs:ListServices'
              - 'ecs:ListTasks'
              - 'eks:DescribeCluster'
              - 'eks:ListClusters'
              - 'elasticache:DescribeCacheClusters'
              - 'elasticache:DescribeReservedCacheNodes'
              - 'elasticloadbalancing:DescribeLoadBalancers'
              - 'es:DescribeReservedElasticsearchInstances'
              - 'es:DescribeReservedInstances'
              - 'es:ListDomainNames'
              - 'iam:ListAccountAliases'
              - 'lambda:GetFunction'
              - 'lambda:ListFunctions'
              - 'organizations:DescribeOrganization'
              - 'rds:DescribeDBInstances'
              - 'rds:DescribeReservedDBInstances'
              - 'redshift:DescribeClusters'
              - 'redshift:DescribeReservedNodes'
              - 's3:GetBucketLocation'
              - 's3:ListAllMyBuckets'
              - 'savingsplans:DescribeSavingsPlans'
              - 'sts:GetCallerIdentity'
              - 'tag:GetResources'
              - 'tag:GetTagKeys'
              - 'tag:GetTagValues'
            'Resource': '*'

  NopsSAMinimalChildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nops-sa-child-role-minimal
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref PayerRoleArn
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref NopsSAMinimalChildPolicy

Outputs:
  RoleArn:
    Description: ARN of the nops-sa-child-role-minimal created in this account.
    Value: !GetAtt NopsSAMinimalChildRole.Arn
